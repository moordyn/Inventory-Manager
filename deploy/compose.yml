services:
  api:
    build:
      context: ..
      dockerfile: server/Inventory.Api/Dockerfile
    environment:
      ConnectionStrings__Inventory: Host=db;Port=5432;Database=inventory;Username=inventory;Password=${POSTGRES_PASSWORD}
      INVENTORY_PIN: ${INVENTORY_PIN}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  inventory_data:
