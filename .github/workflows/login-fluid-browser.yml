name: Login fluid browser visual smoke
on:
  push:
    branches: [main]
    paths:
      - 'server/Inventory.Api/wwwroot/assets/login-fluid.js'
      - 'server/Inventory.Api/wwwroot/index.html'
      - 'tests/login-fluid-browser.cjs'
      - '.github/workflows/login-fluid-browser.yml'
  workflow_dispatch:
jobs:
  fluid:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright pngjs
          npx playwright install --with-deps chromium
      - name: Exercise shader and mouse-driven fluid in Chromium
        run: node tests/login-fluid-browser.cjs
      - name: Upload reference-theme render screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-fluid-browser-renders
          path: |
            /tmp/login-fluid-purple.png
            /tmp/login-fluid-glacier.png
          if-no-files-found: ignore
