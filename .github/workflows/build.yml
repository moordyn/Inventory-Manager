name: Inventory Manager CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build backend
        run: dotnet build server/Inventory.Api/Inventory.Api.csproj --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frontend JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('server/Inventory.Api/wwwroot/index.html','utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw new Error('Inline application script not found');
          new Function(script[1]);
          const ids = new Set([...html.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]));
          const missing = [...html.matchAll(/\$\('([^']+)'\)/g)].map(m=>m[1]).filter(id=>!ids.has(id));
          if (missing.length) throw new Error('Missing element IDs: '+[...new Set(missing)].join(', '));
          const allIds = [...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
          if (new Set(allIds).size !== allIds.length) throw new Error('Duplicate HTML element IDs');
          const stylesheet = html.match(/<style>([\s\S]*?)<\/style>/);
          if (!stylesheet) throw new Error('Application stylesheet missing');
          let depth = 0;
          for (const ch of stylesheet[1]) {
            if (ch === '{') depth++;
            if (ch === '}') depth--;
            if (depth < 0) throw new Error('CSS has an unmatched closing brace');
          }
          if (depth !== 0) throw new Error('CSS has unmatched opening braces');
          for (const required of [
            'class="mobile-nav"', 'id="mainToolbar"', 'id="inventoryCount"',
            'scanner-preview', 'scanner-target', 'scannerTorch',
            'decodeFromVideoElement(video', 'delayBetweenScanAttempts:80',
            'if(activeScannerStop)activeScannerStop()', 'role="dialog"'
          ]) {
            if (!html.includes(required)) throw new Error('UI feature missing: ' + required);
          }
          if (html.includes('decodeFromConstraints({audio:false')) {
            throw new Error('Barcode scanner must reuse its first camera stream');
          }
          const assetBase = 'server/Inventory.Api/wwwroot/assets/';
          const wordmark = fs.readFileSync(assetBase + 'zagg-wordmark.svg', 'utf8');
          const favicon = fs.readFileSync(assetBase + 'zagg-favicon.svg', 'utf8');
          if (!wordmark.includes('viewBox="0 0 900 358"') ||
              !wordmark.includes('aria-label="ZAGG Inventory Manager"') ||
              !wordmark.includes('fill="url(#m)"')) {
            throw new Error('Approved ZAGG wordmark SVG is missing or malformed');
          }
          if (!favicon.includes('<svg') || !favicon.includes('viewBox="0 0 64 64"')) {
            throw new Error('ZAGG favicon SVG is missing or malformed');
          }
          // Five coordinated theme palettes and matching branded SVGs must ship together.
          const palettes = ['mint','purple','ocean','ember','rose','slate','forest','gold','crimson','glacier'];
          for (const theme of palettes) {
            if (!html.includes('body[data-theme="'+theme+'"]') ||
                !html.includes(" "+theme+":{label:")) throw new Error('Missing CSS/selector for theme: '+theme);
            for (const asset of ['zagg-wordmark-','zagg-favicon-']) {
              const svg = fs.readFileSync(assetBase + asset + theme + '.svg','utf8');
              if (!svg.includes('<svg') || !svg.includes('viewBox=')) throw new Error('Invalid theme branding: '+asset+theme);
            }
          }
          for (const marker of ['id="appAurora"', 'class="app-aurora"',
              'const appAurora=(()=>{', 'appAurora.start()', 'appAurora.stop()',
              'appAurora.palette()', 'document.hidden', "prefers-reduced-motion: reduce",
              "if(now-last<50)return"]) {
            if (!html.includes(marker)) throw new Error('Signed-in ambient background missing: '+marker);
          }
          for (const marker of ['id="loginAurora"', 'class="login-aurora"',
              "const loginAurora=(()=>{", "canvas.parentElement.addEventListener('pointermove'",
              "matchMedia('(prefers-reduced-motion: reduce)')", "loginAurora.stop()", "loginAurora.start()"]) {
            if (!html.includes(marker)) throw new Error('Login aurora visual or lifecycle missing: '+marker);
          }
          for (const marker of ['id="myThemeChoices"','id="loginThemeChoices"',
              'data-theme-choice=', 'function setTheme(theme)', 'themeMarkup(active)']) {
            if (!html.includes(marker)) throw new Error('Theme selector missing: '+marker);
          }
          if (!html.includes('name===\'glacier\'?\'light\':\'dark\'')) {
            throw new Error('Glacier Light must switch the browser color scheme');
          }
          for (const selector of ['.nav button:hover:not(.active)', '.mobile-nav button:hover:not(.active)', "body[data-theme=\"glacier\"] .nav button:hover:not(.active)"]) {
            if (!html.includes(selector)) throw new Error('Missing theme-aware navigation hover: '+selector);
          }
          for (const selector of ['.toolbar .search:hover:not(:disabled)', '.toolbar .search::placeholder',
              'body[data-theme="glacier"] tbody tr:hover', '.inventory-responsive tbody tr:hover']) {
            if (!html.includes(selector)) throw new Error('Missing themed search/row hover: '+selector);
          }
          for (const endpoint of ['/api/auth/theme','/api/admin/theme/login']) {
            if (!fs.readFileSync('server/Inventory.Api/Program.cs','utf8').includes(endpoint))
              throw new Error('Theme API missing: '+endpoint);
          }
          for (const brandLocation of ['brand-wordmark-login', 'brand-wordmark-sidebar', 'brand-wordmark-mobile']) {
            if (!html.includes(brandLocation + '" src="/assets/zagg-wordmark.svg"')) {
              throw new Error('ZAGG logo missing from ' + brandLocation);
            }
          }
          if (!html.includes('<title>ZAGG Inventory Manager</title>') ||
              !html.includes('href="/assets/zagg-favicon.svg"')) {
            throw new Error('Browser tab title or icon is missing ZAGG branding');
          }
          if (html.includes('<div class="logo">▦</div> Inventory Manager')) {
            throw new Error('Legacy Inventory Manager brand icon is still present');
          }
          for (const control of ['id="grantStoreAccessBtn"', 'id="removeStoreAccessBtn"', 'id="accessActionHint"']) {
            if (!html.includes(control)) throw new Error('Missing employee access control: '+control);
          }
          for (const action of ['function updateAccessActionState()', "removeStoreAccessBtn').onclick", "confirm('Remove '"]) {
            if (!html.includes(action)) throw new Error('Missing employee access workflow: '+action);
          }
          for (const feature of [
            'id="exportInventoryBtn"', 'id="view-reorder"', 'id="reorderSummary"',
            'id="exportReorderBtn"', 'id="adminAuditList"',
            'id="openProductHistoryBtn"', 'data-quick-delta="-5"',
            "async function loadReorder()", "async function loadAudit()", "function openMovement(item)"
          ]) {
            if (!html.includes(feature)) throw new Error('Reporting/stock UI feature missing: ' + feature);
          }
          const backend=fs.readFileSync('server/Inventory.Api/Program.cs','utf8');
          for (const endpoint of [
            '/api/items/export','/api/items/reorder','/api/items/reorder/export',
            '/api/items/{id:guid}/history','/api/admin/audit'
          ]) {
            if (!backend.includes(endpoint)) throw new Error('Reporting API route missing: '+endpoint);
          }
          if (!backend.includes('CREATE TABLE IF NOT EXISTS admin_audit') || !backend.includes('WriteAdminAudit(')) {
            throw new Error('Administrative activity persistence is missing');
          }
          // Domain belongs to the installer, not this repository's maintainer.
          if (!backend.includes('Environment.GetEnvironmentVariable("PUBLIC_ORIGIN")') ||
              !backend.includes('Uri.TryCreate(publicOriginText,UriKind.Absolute') ||
              !backend.includes('var GoogleRedirect=PublicOrigin+"/api/google/callback";') ||
              !backend.includes('x.GetString()==PublicOrigin')) {
            throw new Error('Google OAuth callback and import validation must use configurable PUBLIC_ORIGIN');
          }
          const importer = fs.readFileSync('deploy/configure-google.sh','utf8');
          const installer = fs.readFileSync('deploy/install.sh','utf8');
          const compose = fs.readFileSync('deploy/compose.yml','utf8');
          if (!importer.includes('public_origin = values_from_env.get("PUBLIC_ORIGIN"') ||
              !importer.includes('expected_callback = public_origin + "/api/google/callback"') ||
              !importer.includes('public_origin not in origins') ||
              !installer.includes('PUBLIC_ORIGIN=%s') ||
              !compose.includes('PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?') ||
              backend.includes('https://zagginventorymanager.com') ||
              importer.includes('https://zagginventorymanager.com')) {
            throw new Error('Bring-your-own-domain installer, Compose or Google import is not wired correctly');
          }
          if (!backend.includes('/api/auth/start-activation') ||
              !backend.includes('/api/auth/forgot-password') ||
              !backend.includes('/api/auth/complete-token') ||
              !backend.includes("SessionIdleMinutes=15") ||
              !backend.includes("app.MapPost(\"/api/auth/login\",()=>Results.StatusCode(StatusCodes.Status410Gone))")) {
            throw new Error('v1.1.0 account activation, recovery, 15-minute sessions, and retired PIN route missing');
          }
          if (!html.includes("const IDLE_LIMIT_MS=15*60*1000") ||
              !html.includes('id="registrationForm"') ||
              !html.includes('id="forgotForm"') ||
              !html.includes('id="authTokenForm"')) {
            throw new Error('v1.1.0 account UI or silent 15-minute session timeout missing');
          }
          for (const marker of [
            'data-edit-checkout-note', 'data-save-checkout-note',
            'data-view-checkout-revisions', 'function noteCellMarkup(entry)',
            'function openCheckoutNoteEditor(button,entry)',
            'function productHistoryTable(events)'
          ]) {
            if (!html.includes(marker)) throw new Error('Editable checkout note UI missing: '+marker);
          }
          for (const endpoint of ['/api/movements/{id:long}/note','/api/movements/{id:long}/note-edits']) {
            if (!backend.includes(endpoint)) throw new Error('Editable checkout note API missing: '+endpoint);
          }
          for (const field of ['movement_note_edits','note_revision','note_updated_by','note_updated_at']) {
            if (!backend.includes(field)) throw new Error('Checkout note history migration missing: '+field);
          }
          if (!backend.includes('m.delta<0') || !backend.includes('req.ExpectedRevision!=revision')) {
            throw new Error('Checkout-only note editing / optimistic concurrency checks missing');
          }
          if (!html.includes('return !!identity&&Number(entry.delta)<0') ||
              !backend.includes('Any active employee who can access this store may annotate its checkout history.')) {
            throw new Error('Store employees must be able to edit checkout notes across all checkout authors');
          }
          console.log('Frontend, branding, scanner, reporting, audit and checkout note editing checks passed');
          NODE

      - name: Test API reporting, store permissions and administrator audit
        env:
          ASPNETCORE_URLS: http://127.0.0.1:18424
          ConnectionStrings__Inventory: Host=127.0.0.1;Port=5432;Database=inventory;Username=postgres;Password=integration-test-only
          SETUP_TOKEN: 0123456789abcdef0123456789abcdef01234567
          GOOGLE_TOKEN_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PUBLIC_ORIGIN: https://inventory.example.com
          ASPNETCORE_ENVIRONMENT: IntegrationTest
          AUTH_EMAIL_TEST_OUTBOX: /tmp/inventory-manager-email-outbox.jsonl
        run: |
          bash -n deploy/install.sh deploy/configure-google.sh deploy/backup.sh
          rm -f "$AUTH_EMAIL_TEST_OUTBOX"
          node --check tests/api-smoke.mjs
          node tests/checkout-note-ui.mjs
          dotnet run --project server/Inventory.Api/Inventory.Api.csproj --configuration Release --no-build > /tmp/zagg-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --show-error --fail http://127.0.0.1:18424/health > /dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/zagg-api.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat /tmp/zagg-api.log
            exit 1
          fi
          node tests/api-smoke.mjs || { cat /tmp/zagg-api.log; exit 1; }

  # One-time v1.0.0 publication. This job only runs for the explicitly marked
  # release commit on main after .NET, frontend and PostgreSQL smoke tests pass.
  publish_v1_0_0:
    name: Publish v1.0.0 GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v1.0.0]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files and version
        run: |
          test "$(tr -d '\r\n' < VERSION)" = '1.0.0'
          grep -q '<Version>1.0.0</Version>' server/Inventory.Api/Inventory.Api.csproj
          test -s docs/releases/v1.0.0.md
      - name: Create v1.0.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.0 GitHub Release already exists; refusing to replace it.'
            exit 0
          fi
          gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Inventory Manager v1.0.0' --notes-file docs/releases/v1.0.0.md
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,publishedAt

  # One-time v1.1.0 publication only after all integration/build checks pass.
  publish_v1_1_0:
    name: Publish v1.1.0 GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v1.1.0]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Confirm release version and notes
        run: |
          test "$(tr -d '\r\n' < VERSION)" = '1.1.0'
          grep -q '<Version>1.1.0</Version>' server/Inventory.Api/Inventory.Api.csproj
          test -s docs/releases/v1.1.0.md
          grep -q '/api/auth/start-activation' server/Inventory.Api/Program.cs
          grep -q '/api/auth/forgot-password' server/Inventory.Api/Program.cs
      - name: Create v1.1.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.1.0 already published; refusing to replace the existing release.'
            exit 0
          fi
          gh release create v1.1.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Inventory Manager v1.1.0' --notes-file docs/releases/v1.1.0.md
          gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,publishedAt

  # Publish v1.2.0 only from an explicitly marked main commit and only if CI passes.
  publish_v1_2_0:
    name: Publish v1.2.0 GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v1.2.0]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version, release notes and included features
        run: |
          test "$(tr -d '\r\n' < VERSION)" = '1.2.0'
          grep -q '<Version>1.2.0</Version>' server/Inventory.Api/Inventory.Api.csproj
          grep -q '<InformationalVersion>1.2.0</InformationalVersion>' server/Inventory.Api/Inventory.Api.csproj
          test -s docs/releases/v1.2.0.md
          grep -q '^## \[1.2.0\]' CHANGELOG.md
          grep -q -- '--domain' deploy/install.sh
          grep -q '/api/auth/change-email' server/Inventory.Api/Program.cs
          grep -q '/api/admin/employees/{id}/id' server/Inventory.Api/Program.cs
          grep -q '/api/admin/employees/{id}/name' server/Inventory.Api/Program.cs
          grep -q 'owner_employee_id' server/Inventory.Api/Program.cs
      - name: Create v1.2.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.2.0 release already exists; refusing to replace it.'
            exit 0
          fi
          gh release create v1.2.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Inventory Manager v1.2.0' --notes-file docs/releases/v1.2.0.md --latest
          gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,publishedAt
