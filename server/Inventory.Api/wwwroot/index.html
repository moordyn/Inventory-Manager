<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Manager</title><style>
:root{color-scheme:dark;font:15px system-ui,Segoe UI,sans-serif;background:#141820;color:#f0f2f5}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:0 auto;padding:30px 18px}h1{font-size:26px}h2{font-size:19px}section{background:#202630;border:1px solid #39414b;border-radius:16px;padding:22px;margin:18px 0}input,button,select{font:inherit;border-radius:9px;padding:12px;border:1px solid #485362;background:#303846;color:white}button{background:#426e5c;cursor:pointer;border:0;font-weight:600}button:hover{background:#578c75}input{max-width:100%;width:100%}label{display:block;color:#a6b0be;margin:10px 0 5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.hidden{display:none}.muted{color:#a6b0be}.item{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #39414b;flex-wrap:wrap}.item button{padding:8px 12px}.danger{color:#f5ad86}#message{min-height:24px}small{color:#a6b0be}</style></head><body><main><header><h1>Inventory Manager</h1><p class="muted">Central inventory · Online only</p></header><p id="message" role="status"></p>
<section id="setup" class="hidden"><h2>First-time setup</h2><p class="muted">Create your six-digit PIN. Enter the one-time setup token printed by the installer.</p><form id="setupForm"><label>Setup token</label><input id="setupToken" required autocomplete="off"><label>New six-digit PIN</label><input id="newPin" required type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"><label>Confirm PIN</label><input id="confirmPin" required type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"><p><button>Create PIN</button></p></form></section>
<section id="login" class="hidden"><h2>Unlock inventory</h2><form id="loginForm"><label>Six-digit PIN</label><input id="pin" required type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off"><p><button>Unlock</button></p></form></section>
<div id="dashboard" class="hidden"><section><div class="grid"><div><h2>Scan or search</h2><input id="search" placeholder="Scan barcode / enter SKU" autofocus><small>USB keyboard scanners can scan directly into this field.</small></div><div><h2>Session</h2><button id="logout">Log out</button></div></div></section>
<section><h2>Add item</h2><form id="addForm" class="grid"><div><label>SKU / barcode</label><input id="sku" required></div><div><label>Item name</label><input id="name" required></div><div><label>Starting quantity</label><input id="quantity" type="number" min="0" value="0" required></div><div style="align-self:end"><button>Add item</button></div></form></section>
<section><h2>Inventory</h2><div id="items"></div></section><section><h2>Recent movements</h2><div id="history"></div></section></div>
</main><script>
let token=sessionStorage.getItem('inventory-token')||'',items=[];
const $=id=>document.getElementById(id);
const show=id=>{for(const name of ['setup','login','dashboard']) $(name).classList.toggle('hidden',name!==id)};
const msg=s=>$('message').textContent=s;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){const res=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!res.ok)throw Error((await res.text()).slice(0,180));return res.json()}
async function start(){try{const s=await api('auth/status');if(!s.initialized)show('setup');else if(token){show('dashboard');await refresh()}else show('login')}catch(e){msg(e.message)}}
$('setupForm').onsubmit=async e=>{e.preventDefault();try{await api('auth/setup','POST',{setupToken:$('setupToken').value,pin:$('newPin').value,confirmPin:$('confirmPin').value});msg('PIN created. Log in to continue.');show('login')}catch(e){msg(e.message)}};
$('loginForm').onsubmit=async e=>{e.preventDefault();try{token=(await api('auth/login','POST',{pin:$('pin').value})).token;sessionStorage.setItem('inventory-token',token);$('pin').value='';show('dashboard');msg('');await refresh()}catch(e){msg('Incorrect PIN or temporarily locked out.')}};
$('logout').onclick=async()=>{try{await api('auth/logout','POST')}catch{}token='';sessionStorage.removeItem('inventory-token');show('login')};
$('addForm').onsubmit=async e=>{e.preventDefault();try{await api('items','POST',{sku:$('sku').value,name:$('name').value,quantity:Number($('quantity').value)});$('addForm').reset();$('quantity').value='0';msg('Item created');await refresh()}catch(e){msg(e.message)}};
async function refresh(){try{items=await api('items');const history=await api('movements');render();$('history').innerHTML=history.length?history.map(x=>'<div class="item"><span>'+escapeHtml(x.name)+' · '+escapeHtml(x.sku)+'</span><span>'+ (x.delta>0?'+':'')+x.delta+' → '+x.after+' <small>'+new Date(x.time).toLocaleString()+'</small></span></div>').join(''):'<p class="muted">No movements yet</p>'}catch(e){msg(e.message);if(e.message.includes('401')){token='';sessionStorage.removeItem('inventory-token');show('login')}}}
function render(){const q=$('search').value.trim().toLowerCase(),found=items.filter(x=>x.sku.toLowerCase().includes(q)||x.name.toLowerCase().includes(q));$('items').innerHTML=found.length?found.map(x=>'<div class="item"><div><strong>'+escapeHtml(x.name)+'</strong><br><small>'+escapeHtml(x.sku)+'</small></div><div>Stock: <strong>'+x.quantity+'</strong> &nbsp; <button data-id="'+x.id+'" data-dir="1">Check in</button> <button data-id="'+x.id+'" data-dir="-1">Check out</button></div></div>').join(''):'<p class="muted">No matching items. Add the scanned barcode above.</p>'}
$('search').oninput=render;
$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const exact=items.find(x=>x.sku.toLowerCase()===$('search').value.trim().toLowerCase());if(!exact){$('sku').value=$('search').value.trim();$('name').focus()}else render()}};
$('items').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const qty=Number(prompt('Quantity?', '1'));if(!Number.isSafeInteger(qty)||qty<=0)return;const delta=qty*Number(b.dataset.dir);try{await api('items/'+b.dataset.id+'/movements','POST',{delta,idempotencyKey:crypto.randomUUID()});msg('Quantity updated');await refresh()}catch(err){msg(err.message)}};
start();
</script></body></html>
